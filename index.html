<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Belleza y Estilo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #fff5f7; color: #4a4a4a; padding: 20px; }
        header { text-align: center; padding: 40px 20px; background: #fff; border-radius: 15px; box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3); margin-bottom: 30px; }
        h1 { color: #d85a7fff; font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #888; font-size: 1.1rem; }
        
        /* Cuadrícula de productos */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        
        /* Tarjeta de producto */
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; padding: 15px; transition: transform 0.3s; border: 1px solid #ffe3e8; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(216, 90, 127, 0.2); }
        .product-card img { width: 100%; height: 220px; object-fit: contain; border-radius: 8px; background-color: #fafafa; }
        .product-card h3 { font-size: 1.1rem; color: #333; margin: 15px 0 8px 0; text-transform: capitalize; }
        .btn-contacto { display: inline-block; background: #d85a7f; color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; margin-top: 10px; font-weight: bold; }
        .btn-contacto:hover { background: #b84364; }
    </style>
</head>
<body>

    <header>
        <h1>Mi Catálogo de Belleza & Estilo</h1>
        <p>Explora nuestros productos disponibles</p>
    </header>

    <main class="catalog-grid">
        <!-- Tarjeta de Producto (Copia y pega este bloque para agregar más productos) -->
        <div class="product-card">
            <img src="GLAM.png" alt="Labial Glam">
            <h3>Labial Glam</h3>
            <a href="https://wa.me" target="_blank" class="btn-contacto">Pedir por WhatsApp</a>
        </div>

        <div class="product-card">
            <img src="coco.png" alt="Paleta Coco">
            <h3>Paleta Coco</h3>
            <a href="https://wa.me" target="_blank" class="btn-contacto">Pedir por WhatsApp</a>
        </div>

        <div class="product-card">
            <img src="delineador.png" alt="Delineador">
            <h3>Delineador</h3>
            <a href="https://wa.me" target="_blank" class="btn-contacto">Pedir por WhatsApp</a>
        </div>

        <div class="product-card">
            <img src="crema.png" alt="Crema Corporal">
            <h3>Crema Corporal</h3>
            <a href="https://wa.me" target="_blank" class="btn-contacto">Pedir por WhatsApp</a>
        </div>
        <!-- Fin de los bloques de ejemplo -->
    </main>

</body>
</html>
